[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-diagnostics-data-analysis"
version = "0.2.2"
description = "Reproducible Python workflows for experimental plasma diagnostics, signal processing, spectroscopy, X-ray, magnetic, electrostatic, turbulence and transport analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ramin Alipour", email = "alipour_r@ymail.com"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
]

[project.scripts]
tokamak-workbench = "tokamak_workbench.app:main"

[project.optional-dependencies]
dev = ["jupyter>=1.0", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "plasma_core*",
  "plasma_provenance*",
  "cross_diagnostic*",
  "diagnostic_pipeline*",
  "electrostatic_diagnostics*",
  "hard_xray*",
  "magnetic_diagnostics*",
  "publication_reconstruction*",
  "research_continuity*",
  "spectroscopy*",
  "synthetic_data*",
  "turbulence_transport*",
  "tokamak_workbench*",
]

[tool.setuptools.package-data]
plasma_provenance = ["records.json", "README.md"]

[tool.setuptools.data-files]
"share/plasma-diagnostics-data-analysis" = [
  "DATA_TERMS.md",
]
"share/plasma-diagnostics-data-analysis/datasets" = [
  "datasets/README.md",
  "datasets/DATASET_AUDIT_REPORT.md",
  "datasets/PROVENANCE_CONFLICTS.md",
  "datasets/dataset_inventory.csv",
]
"share/plasma-diagnostics-data-analysis/datasets/dataset_a" = [
  "datasets/dataset_a/README.md",
  "datasets/dataset_a/source_manifest.csv",
]
"share/plasma-diagnostics-data-analysis/datasets/dataset_a/laboratory_measurements" = [
  "datasets/dataset_a/laboratory_measurements/*.csv",
]
"share/plasma-diagnostics-data-analysis/datasets/dataset_a/laboratory_signal_analysis" = [
  "datasets/dataset_a/laboratory_signal_analysis/*.csv",
]
"share/plasma-diagnostics-data-analysis/datasets/dataset_b" = [
  "datasets/dataset_b/README.md",
  "datasets/dataset_b/column_provenance.csv",
  "datasets/dataset_b/source_manifest.csv",
]
"share/plasma-diagnostics-data-analysis/datasets/dataset_b/publication_reconstruction" = [
  "datasets/dataset_b/publication_reconstruction/*.csv",
]
"share/plasma-diagnostics-data-analysis/datasets/dataset_b/publication_digitization" = [
  "datasets/dataset_b/publication_digitization/*.csv",
]

"share/plasma-diagnostics-data-analysis/datasets/dataset_audit" = [
  "datasets/dataset_audit/p01_reconciliation.csv",
]
