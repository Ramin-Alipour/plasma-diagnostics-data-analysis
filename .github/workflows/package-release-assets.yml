name: Package and attach v0.2.0 release assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: v0.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build source distribution and wheel
        run: python -m build --outdir dist

      - name: Create source archive and SHA-256 checksums
        run: |
          git archive --format=zip --prefix=plasma-diagnostics-data-analysis-0.2.0/ v0.2.0 \
            -o dist/plasma-diagnostics-data-analysis-0.2.0-source.zip
          cd dist
          sha256sum *.whl *.tar.gz *-source.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach validated assets to the existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*-source.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
