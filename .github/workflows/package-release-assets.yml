name: Build and attach release assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-release-assets.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag to package (for example, v0.2.2)"
        required: true
        default: "v0.2.2"
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Align the existing v0.2.2 tag with the validated release commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v0.2.2' }}
          TARGET_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            -d "{\"sha\":\"${TARGET_SHA}\",\"force\":true}"
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || 'v0.2.2' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build source distribution and wheel
        run: python -m build --outdir dist

      - name: Create source archive and SHA-256 checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v0.2.2' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          git archive --format=zip --prefix="plasma-diagnostics-data-analysis-${VERSION}/" "${RELEASE_TAG}" \
            -o "dist/plasma-diagnostics-data-analysis-${VERSION}-source.zip"
          cd dist
          sha256sum *.whl *.tar.gz *-source.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach validated assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || 'v0.2.2' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*-source.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
