name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Execute all notebooks
        if: ${{ matrix.python-version == '3.11' }}
        run: |
          mkdir -p /tmp/executed-notebooks
          while IFS= read -r -d '' notebook; do
            echo "Executing $notebook"
            jupyter nbconvert --execute --to notebook \
              --ExecutePreprocessor.timeout=300 \
              --output-dir /tmp/executed-notebooks "$notebook"
          done < <(find notebooks -type f -name '*.ipynb' -print0 | sort -z)

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            plasma_core \
            spectroscopy \
            magnetic_diagnostics \
            electrostatic_diagnostics \
            turbulence_transport \
            hard_xray \
            cross_diagnostic \
            synthetic_data \
            plasma_provenance \
            publication_reconstruction \
            research_continuity \
            diagnostic_pipeline \
            tests

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib
          import pathlib

          packages = [
              "plasma_core",
              "spectroscopy",
              "magnetic_diagnostics",
              "electrostatic_diagnostics",
              "turbulence_transport",
              "hard_xray",
              "cross_diagnostic",
              "synthetic_data",
              "plasma_provenance",
              "publication_reconstruction",
              "research_continuity",
              "diagnostic_pipeline",
          ]

          modules = []

          for package in packages:
              for path in pathlib.Path(package).rglob("*.py"):
                  if path.name == "__init__.py" or not path.name.startswith("_"):
                      modules.append(".".join(path.with_suffix("").parts))

          for module in sorted(set(modules)):
              importlib.import_module(module)

          print(f"Imported {len(set(modules))} modules successfully.")
          PY

      - name: Build and test installed wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/plasma-wheel .
          python -m venv --system-site-packages /tmp/plasma-wheel-env
          /tmp/plasma-wheel-env/bin/python -m pip install --no-deps /tmp/plasma-wheel/plasma_diagnostics_data_analysis-*.whl
          cd /tmp
          /tmp/plasma-wheel-env/bin/python - <<'PY'
          from plasma_provenance.dataset_archive import dataset_manifest, load_dataset_table
          from publication_reconstruction.reconstruct import reconstruct_paper1
          from publication_reconstruction.reconciliation import validate_p01_reconciliation

          a_table = load_dataset_table("A", "laboratory_measurements/exp1_spectroscopy.csv")
          e06 = load_dataset_table("A", "laboratory_signal_analysis/e06_mhd_signal.csv")
          b_table = load_dataset_table("B", "publication_reconstruction/paper1_spectroscopy.csv")
          assert len(a_table) == 15
          assert len(e06) == 423
          assert not dataset_manifest("A").empty
          assert len(b_table) == 15
          assert not dataset_manifest("B").empty
          assert len(reconstruct_paper1()[1]) == 15
          reconciliation = validate_p01_reconciliation()
          assert reconciliation["rows"] == 15
          assert reconciliation["numeric_corrections_applied"] == 0
          print("Installed wheel loads Dataset A measurements, owner-confirmed E06, Dataset B reconstruction, and both manifests.")
          PY

